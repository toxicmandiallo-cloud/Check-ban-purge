<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LA PURGE - Check-Ban</title>
    <style>
        body { background: #0a0a0a; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background-image: radial-gradient(circle, #1a0000 0%, #000 100%); }
        .container { text-align: center; background: rgba(20, 0, 0, 0.8); padding: 40px; border-radius: 15px; border: 1px solid #ff0000; box-shadow: 0 0 30px rgba(255, 0, 0, 0.4); max-width: 400px; width: 90%; }
        h1 { color: #ff0000; text-shadow: 0 0 10px #ff0000; letter-spacing: 5px; margin-bottom: 5px; }
        p { color: #aaa; font-size: 0.9em; margin-bottom: 30px; }
        input { padding: 15px; width: 80%; border-radius: 8px; border: 1px solid #333; background: #111; color: #fff; margin-bottom: 15px; outline: none; text-align: center; font-size: 1.1em; }
        input:focus { border-color: #ff0000; box-shadow: 0 0 10px rgba(255,0,0,0.5); }
        button { padding: 15px 30px; background: #ff0000; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1.1em; letter-spacing: 2px; transition: 0.3s; width: 85%; }
        button:hover { background: #cc0000; box-shadow: 0 0 20px rgba(255,0,0,0.8); }
        #result { margin-top: 25px; font-size: 1.2em; font-weight: bold; min-height: 50px; }
        .banned { color: #ff3333; text-shadow: 0 0 10px #ff0000; }
        .active { color: #33ff33; text-shadow: 0 0 10px #00ff00; }
        .loading { color: #ffaa00; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .footer { margin-top: 30px; font-size: 0.8em; color: #555; }
    </style>
</head>
<body>
    <div class="container">
        <h1>L A  P U R G E</h1>
        <p>Entrez le numéro pour vérifier son statut</p>
        
        <input type="text" id="numberInput" placeholder="Ex: 225055619385">
        <button onclick="checkBan()">VÉRIFIER</button>
        
        <div id="result"></div>
        
        <div class="footer">
            © NOBODY DEV - L'élite silencieuse
        </div>
    </div>

    <script>
        async function checkBan() {
            const number = document.getElementById('numberInput').value.trim();
            const resultDiv = document.getElementById('result');
            
            if (!number) { 
                resultDiv.innerHTML = "<span class='banned'>Veuillez entrer un numéro.</span>"; 
                return; 
            }
            
            resultDiv.innerHTML = "<span class='loading'>Analyse en cours...</span>";

            try {
                // ⚠️ ICI ON APPELLE L'API PUBLIQUE DE CHECK-BAN
                // C'est la même API que les sites de tes captures utilisent en coulisses
                const response = await fetch(`https://api.lexz.dev/ban?number=${number}`);
                const data = await response.json();
                
                if (data.status === 'BANNED' || data.banned === true) {
                    resultDiv.innerHTML = `<span class="banned">🔴 BANNI</span><br><span style="font-size:0.8em; color:#888;">Ce numéro est éliminé.</span>`;
                } else if (data.status === 'ACTIVE' || data.banned === false) {
                    resultDiv.innerHTML = `<span class="active">🟢 ACTIF</span><br><span style="font-size:0.8em; color:#888;">Ce numéro est toujours en vie.</span>`;
                } else {
                    resultDiv.innerHTML = `<span class="loading">Résultat inconnu.</span>`;
                }
            } catch (error) {
                resultDiv.innerHTML = "<span class='banned'>Erreur de connexion au serveur.</span>";
                console.error(error);
            }
        }
    </script>
</body>
  </html>
